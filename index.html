<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>책과함께직진 — 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBmEl7eb2BjIjYBQtVCbKeiVRY-4g0kE4o",
    authDomain: "chaek-gwa-hamkke.firebaseapp.com",
    databaseURL: "https://chaek-gwa-hamkke-default-rtdb.firebaseio.com",
    projectId: "chaek-gwa-hamkke",
    storageBucket: "chaek-gwa-hamkke.firebasestorage.app",
    messagingSenderId: "967387128079",
    appId: "1:967387128079:web:b0b97b15fb5cd6ccc79e7a"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window.__fb = { ref, onValue, set, db };
  window.dispatchEvent(new Event('fb-ready'));
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --purple-50:#EEEDFE;--purple-100:#CECBF6;--purple-400:#7F77DD;--purple-600:#534AB7;--purple-800:#3C3489;--purple-900:#26215C;
  --teal-50:#E1F5EE;--teal-400:#1D9E75;--teal-800:#085041;
  --red-50:#FCEBEB;--red-400:#E24B4A;--red-800:#501313;
  --amber-50:#FAEEDA;--amber-400:#BA7517;
  --gray-50:#F6F5F3;--gray-100:#EDECEA;--gray-200:#D4D2CC;--gray-400:#888780;--gray-700:#4A4945;--gray-900:#1A1917;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--gray-50);color:var(--gray-900);font-size:13px;line-height:1.5;}

/* 전체 레이아웃 */
#app{display:grid;grid-template-rows:56px 1fr;height:100vh;}
header{background:var(--purple-900);color:white;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.header-brand{display:flex;align-items:center;gap:8px;}
.header-icon{width:28px;height:28px;background:var(--purple-400);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.header-title{font-size:15px;font-weight:700;}
.header-badge{font-size:11px;background:var(--red-400);color:white;padding:2px 8px;border-radius:99px;font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#5CD68C;}
.sync-dot.syncing{background:#F2C572;}
.sync-dot.offline{background:var(--red-400);}
#syncLabel{font-size:11px;color:rgba(255,255,255,0.7);}
.header-link{font-size:12px;color:rgba(255,255,255,0.6);text-decoration:none;border:1px solid rgba(255,255,255,0.2);padding:4px 10px;border-radius:99px;}
.header-link:hover{color:white;border-color:rgba(255,255,255,0.5);}

#main{display:grid;grid-template-columns:45% 1fr;height:100%;overflow:hidden;}

/* 왼쪽 패널 */
#leftPanel{background:white;border-right:1px solid var(--gray-200);display:flex;flex-direction:column;overflow:hidden;}
#pwWall{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;gap:12px;}
#pwWall .pw-title{font-size:15px;font-weight:700;color:var(--purple-800);}
#pwWall input{width:100%;padding:10px 12px;border:1px solid var(--gray-200);border-radius:8px;font-size:14px;font-family:inherit;text-align:center;}
#pwWall input:focus{outline:none;border-color:var(--purple-400);}
#pwWall .pw-err{font-size:12px;color:var(--red-400);min-height:16px;}

/* 탭 */
#tabBar{display:flex;border-bottom:1px solid var(--gray-200);flex-shrink:0;}
.tab-btn{flex:1;padding:14px 4px;font-size:14px;font-weight:600;border:none;background:transparent;cursor:pointer;color:var(--gray-400);font-family:inherit;border-bottom:3px solid transparent;transition:all 0.15s;white-space:nowrap;}
.tab-btn.active{color:var(--purple-700, #534AB7);border-bottom-color:var(--purple-600);}
.tab-btn:hover{color:var(--purple-600);}

#tabContent{flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;}
.tab-pane{display:none;flex-direction:column;flex:1;overflow:hidden;}
.tab-pane.active{display:flex;}
#tab-event, #tab-setting{overflow-y:auto;}

/* 폼 공통 */
.section-title{font-size:13px;font-weight:700;color:var(--purple-800);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.field{margin-bottom:10px;}
.field label{font-size:11px;color:var(--gray-400);display:block;margin-bottom:4px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--gray-200);border-radius:6px;font-family:inherit;background:var(--gray-50);color:var(--gray-900);}
.field input:focus,.field select:focus{outline:none;border-color:var(--purple-400);background:white;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn-row{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;}
.btn{padding:7px 14px;font-size:12px;border-radius:6px;border:1px solid var(--gray-200);background:white;color:var(--gray-700);cursor:pointer;font-family:inherit;font-weight:600;}
.btn:hover{background:var(--gray-50);}
.btn.primary{background:var(--purple-600);color:white;border-color:var(--purple-600);}
.btn.primary:hover{background:var(--purple-800);}
.btn.danger{border-color:var(--red-400);color:var(--red-400);}
.divider{border:none;border-top:1px solid var(--gray-100);margin:14px 0;}

/* 리스트 아이템 */
.list-box{margin-top:10px;flex:1;overflow-y:auto;border:1px solid var(--gray-200);border-radius:6px;min-height:80px;}
.list-item{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--gray-100);font-size:12px;}
.list-item:last-child{border-bottom:none;}
.list-item-text{flex:1;word-break:break-all;}
.list-item-actions{display:flex;gap:4px;flex-shrink:0;}
.list-item-btn{font-size:11px;padding:2px 7px;border:none;background:transparent;cursor:pointer;color:var(--gray-400);font-family:inherit;border-radius:4px;}
.list-item-btn:hover{background:var(--gray-100);color:var(--gray-700);}
.list-empty{padding:12px;color:var(--gray-400);font-size:12px;text-align:center;}

/* 날짜 칩 */
.date-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;min-height:24px;}
.date-chip{display:inline-flex;align-items:center;gap:3px;background:var(--purple-50);color:var(--purple-800);border:1px solid var(--purple-100);border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600;}
.date-chip-del{cursor:pointer;opacity:0.6;font-size:13px;}
.date-chip-del:hover{opacity:1;}

/* 오른쪽 달력 영역 */
#rightPanel{display:flex;flex-direction:column;overflow:hidden;padding:16px 20px;}

/* 통계 */
#statsRow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;flex-shrink:0;}
.stat{background:white;border:1px solid var(--gray-100);border-radius:10px;padding:10px 14px;}
.stat-val{font-size:22px;font-weight:700;color:var(--purple-800);}
.stat-label{font-size:11px;color:var(--gray-400);}

/* 달력 컨트롤 */
.cal-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-shrink:0;}
.month-label{font-size:16px;font-weight:700;}
.nav-btns{display:flex;gap:6px;}
.nav-btn{padding:5px 11px;font-size:13px;border:1px solid var(--gray-200);border-radius:6px;background:white;cursor:pointer;font-family:inherit;}
.nav-btn:hover{background:var(--gray-50);}
.filter-row{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-shrink:0;}
.filter-label{font-size:12px;color:var(--gray-400);}
.ftag{padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--gray-200);cursor:pointer;background:white;color:var(--gray-400);font-family:inherit;}
.ftag.on{font-weight:600;}
.ftag.all.on{background:var(--purple-50);color:var(--purple-800);border-color:var(--purple-400);}
.ftag.pending.on{background:var(--gray-100);color:var(--gray-700);border-color:var(--gray-400);}
.ftag.done.on{background:var(--teal-50);color:var(--teal-800);border-color:var(--teal-400);}
#teamFilter{padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--gray-200);background:white;color:var(--gray-700);font-family:inherit;cursor:pointer;}

/* 달력 */
#calWrap{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px;flex-shrink:0;}
.ch{text-align:center;font-size:13px;font-weight:600;color:var(--gray-400);padding:3px 0;}
.ch.sun{color:var(--red-400);}
.ch.sat{color:#185FA5;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1;}
.cell{border:1px solid var(--gray-100);border-radius:5px;padding:4px 5px;background:white;overflow:hidden;min-height:0;}
.cell.empty{background:transparent;border-color:transparent;}
.cell.today{border:2px solid var(--purple-400);}
.cell.weekend{background:#FAFAF9;}
.cell.selected{background:var(--purple-50);border:2px solid var(--purple-400);}
.dn{font-size:13px;color:var(--gray-400);margin-bottom:2px;cursor:pointer;}
.dn:hover{color:var(--purple-600);}
.dn.sun{color:var(--red-400);}
.dn.sat{color:#185FA5;}
.today-circle{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:var(--purple-600);color:white;border-radius:50%;font-size:12px;font-weight:700;}
.evt{font-size:11px;padding:2px 6px;border-radius:3px;margin-bottom:2px;display:flex;align-items:center;gap:3px;line-height:1.4;cursor:pointer;}
.evt:hover{filter:brightness(0.93);}
.evt-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.evt-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;}
.evt-del{cursor:pointer;opacity:0.5;font-size:12px;flex-shrink:0;}
.evt-del:hover{opacity:1;}
.note-evt{font-size:11px;color:#E24B4A;display:block;font-weight:600;line-height:1.3;}
.add-cell-btn{width:100%;margin-top:2px;padding:2px;font-size:11px;border:1px dashed var(--gray-200);border-radius:3px;background:transparent;cursor:pointer;color:var(--gray-400);font-family:inherit;}
.add-cell-btn:hover{background:var(--gray-50);}
.legend{display:flex;gap:10px;margin-top:8px;flex-shrink:0;}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--gray-400);}
.leg-dot{width:7px;height:7px;border-radius:50%;}

/* 수정 모달 */
#editModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;align-items:center;justify-content:center;}
#editModal.open{display:flex;}
#editModalBox{background:white;border-radius:14px;padding:20px;width:min(340px,90vw);box-shadow:0 8px 32px rgba(0,0,0,0.18);}
#editModalBox .modal-title{font-size:14px;font-weight:700;color:var(--purple-800);margin-bottom:14px;}
#editModalBox .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--purple-900);color:white;font-size:13px;padding:10px 20px;border-radius:10px;display:none;z-index:999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.2);}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="header-brand">
   <div class="header-icon">📚</div>
   <div class="header-title">2026 책과함께직진</div>
   <span class="header-badge">관리자</span>
  </div>
  <div class="header-right">
   <span class="sync-dot" id="syncDot"></span>
   <span id="syncLabel">연결 중...</span>
   <a href="/" class="header-link">👁 학생 보기</a>
  </div>
 </header>

 <div id="main">
  <!-- 왼쪽 패널 -->
  <div id="leftPanel">
   <!-- 비밀번호 잠금 화면 -->
   <div id="pwWall">
    <div style="font-size:28px;">🔒</div>
    <div class="pw-title">관리자 로그인</div>
    <input type="password" id="pwInput" placeholder="비밀번호 입력">
    <button class="btn primary" id="btnLogin" style="width:100%;padding:10px;">로그인</button>
    <div class="pw-err" id="pwErr"></div>
   </div>

   <!-- 로그인 후 탭 패널 -->
   <div id="adminContent" style="display:none;flex-direction:column;height:100%;">
    <div id="tabBar">
     <button class="tab-btn active" data-tab="tab-team">🏷️ 팀</button>
     <button class="tab-btn" data-tab="tab-event">📅 일정</button>
     <button class="tab-btn" data-tab="tab-notice">📣 공지</button>
     <button class="tab-btn" data-tab="tab-block">🚫 차단</button>
     <button class="tab-btn" data-tab="tab-setting">⚙️ 설정</button>
    </div>
    <div id="tabContent">

     <!-- 팀 등록 -->
     <div class="tab-pane active" id="tab-team">
      <div class="section-title">🏷️ 팀 등록</div>
      <div class="field"><label for="teamNameInput">새 팀 이름</label><input type="text" id="teamNameInput" placeholder="예: 사과, 근육도서관"></div>
      <div class="btn-row"><button class="btn primary" id="btnTeamAdd">+ 팀 추가</button></div>
      <div class="list-box"><div id="teamList"><div class="list-empty">등록된 팀이 없습니다.</div></div></div>
     </div>

     <!-- 일정 추가 -->
     <div class="tab-pane" id="tab-event">
      <div class="section-title">📅 일정 추가</div>
      <div class="field">
       <label for="evtDate">날짜 <span style="font-size:10px;color:var(--gray-400);">(달력 클릭 또는 직접 입력)</span></label>
       <input type="date" id="evtDate">
       <div class="date-chips" id="evtDateChips"></div>
      </div>
      <div class="field"><label for="evtTeam">팀 이름</label>
       <select id="evtTeam"><option value="">(팀 없음 - 공지용)</option></select>
      </div>
      <div class="row2">
       <div class="field"><label for="evtTime">활동 시간</label>
        <select id="evtTime">
         <option value="점심시간">점심시간</option>
         <option value="">방과후</option>
         <option value="비대면">비대면</option>
        </select>
       </div>
       <div class="field"><label for="evtStatus">상태</label>
        <select id="evtStatus">
         <option value="예정">예정</option>
         <option value="완료">완료</option>
         <option value="변경">변경</option>
        </select>
       </div>
      </div>
      <div class="field"><label for="evtNote">공지사항 (선택)</label><input type="text" id="evtNote" placeholder="예: 사서쌤 출장으로 방과후 불가"></div>
      <div class="btn-row">
       <button class="btn" id="btnClear">초기화</button>
       <button class="btn primary" id="addBtn">+ 일정 추가</button>
      </div>
     </div>

     <!-- 공지사항 관리 -->
     <div class="tab-pane" id="tab-notice">
      <div class="section-title">📣 공지사항 관리</div>
      <div class="field"><label for="noticeText">내용</label><input type="text" id="noticeText" placeholder="예: 사서쌤 출장으로 방과후 불가"></div>
      <div class="field"><label for="noticeDate">날짜</label><input type="date" id="noticeDate"></div>
      <div class="btn-row">
       <button class="btn" id="btnNoticeClear">초기화</button>
       <button class="btn primary" id="btnNoticeAdd">+ 공지 추가</button>
      </div>
      <div class="list-box"><div id="noticeList"><div class="list-empty">등록된 공지가 없습니다.</div></div></div>
     </div>

     <!-- 등록 차단 -->
     <div class="tab-pane" id="tab-block">
      <div class="section-title">🚫 등록 차단 설정</div>
      <div style="font-size:11px;color:var(--gray-400);margin-bottom:10px;">지정한 날짜+시간은 학생 일정 등록 불가</div>
      <div class="field"><label for="blockDate">날짜</label><input type="date" id="blockDate"></div>
      <div class="field"><label for="blockTime">활동 시간</label>
       <select id="blockTime">
        <option value="점심시간">점심시간</option>
        <option value="">방과후</option>
        <option value="비대면">비대면</option>
       </select>
      </div>
      <div class="btn-row"><button class="btn primary" id="btnBlockAdd">+ 차단 추가</button></div>
      <div class="list-box"><div id="blockList"><div class="list-empty">등록된 차단이 없습니다.</div></div></div>
     </div>

     <!-- 설정 -->
     <div class="tab-pane" id="tab-setting">
      <div class="section-title">⚙️ 설정</div>
      <div class="divider" style="margin-top:0;"></div>
      <div style="font-size:12px;color:var(--gray-400);margin-bottom:8px;font-weight:600;">🔒 관리자 비밀번호 변경</div>
      <div class="field"><label for="newPw1">새 비밀번호</label><input type="password" id="newPw1" placeholder="새 비밀번호"></div>
      <div class="field"><label for="newPw2">확인</label><input type="password" id="newPw2" placeholder="다시 입력"></div>
      <div class="btn-row"><button class="btn primary" id="btnChangePw">변경</button></div>
      <div class="divider"></div>
      <div style="font-size:12px;color:var(--gray-400);margin-bottom:8px;font-weight:600;">🚪 로그아웃</div>
      <button class="btn" id="btnLogout" style="width:100%;">로그아웃</button>
     </div>

    </div><!-- /tabContent -->
   </div><!-- /adminContent -->
  </div><!-- /leftPanel -->

  <!-- 오른쪽 달력 -->
  <div id="rightPanel">
   <div id="statsRow">
    <div class="stat"><div class="stat-val" id="sTot">0</div><div class="stat-label">이번 달 일정</div></div>
    <div class="stat"><div class="stat-val" id="sDone">0</div><div class="stat-label">완료</div></div>
    <div class="stat"><div class="stat-val" id="sPct">0%</div><div class="stat-label">완료율</div></div>
   </div>
   <div class="cal-controls">
    <div class="month-label" id="monthLabel"></div>
    <div class="nav-btns">
     <button class="nav-btn" id="btnPrev">‹</button>
     <button class="nav-btn" id="btnToday">오늘</button>
     <button class="nav-btn" id="btnNext">›</button>
    </div>
   </div>
   <div class="filter-row">
    <span class="filter-label">보기:</span>
    <button class="ftag all on" data-filter="전체">전체</button>
    <button class="ftag pending" data-filter="예정">예정</button>
    <button class="ftag done" data-filter="완료">완료</button>
    <select id="teamFilter"><option value="전체팀">팀 전체</option></select>
   </div>
   <div id="calWrap">
    <div class="cal-head">
     <div class="ch sun">일</div><div class="ch">월</div><div class="ch">화</div><div class="ch">수</div>
     <div class="ch">목</div><div class="ch">금</div><div class="ch sat">토</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
   </div>
   <div class="legend">
    <div class="leg"><span class="leg-dot" style="background:#888780"></span>예정</div>
    <div class="leg"><span class="leg-dot" style="background:#1D9E75"></span>완료</div>
    <div class="leg"><span class="leg-dot" style="background:#BA7517"></span>변경</div>
    <div class="leg"><span class="leg-dot" style="background:#E24B4A"></span>공지</div>
   </div>
  </div><!-- /rightPanel -->
 </div><!-- /main -->
</div><!-- /app -->

<!-- 일정 수정 모달 -->
<div id="editModal">
 <div id="editModalBox">
  <div class="modal-title">✏️ 일정 수정</div>
  <div class="field"><label for="modalDate">날짜</label><input type="date" id="modalDate"></div>
  <div class="field"><label for="modalTeam">팀 이름</label><select id="modalTeam"><option value="">(팀 없음)</option></select></div>
  <div class="row2">
   <div class="field"><label for="modalTime">활동 시간</label>
    <select id="modalTime">
     <option value="점심시간">점심시간</option>
     <option value="">방과후</option>
     <option value="비대면">비대면</option>
    </select>
   </div>
   <div class="field"><label for="modalStatus">상태</label>
    <select id="modalStatus">
     <option value="예정">예정</option>
     <option value="완료">완료</option>
     <option value="변경">변경</option>
    </select>
   </div>
  </div>
  <div class="field"><label for="modalNote">공지사항</label><input type="text" id="modalNote"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--gray-200);border-radius:8px;margin-top:4px;">
   <div>
    <div style="font-size:12px;font-weight:600;color:var(--gray-700);">🔐 학생 날짜 수정 잠금</div>
    <div style="font-size:10px;color:var(--gray-400);">ON 시 학생 수정 불가</div>
   </div>
   <button id="btnModalLock" style="padding:5px 12px;font-size:11px;border-radius:99px;border:1px solid var(--teal-400);cursor:pointer;font-family:inherit;font-weight:600;background:var(--teal-50);color:var(--teal-800);" onclick="toggleModalLock()">🔓 잠금 OFF</button>
  </div>
  <div class="modal-btns">
   <button class="btn danger" id="btnModalDelete">삭제</button>
   <button class="btn" id="btnModalCancel">취소</button>
   <button class="btn primary" id="btnModalSave">저장</button>
  </div>
 </div>
</div>

<div id="toast"></div>

<script>
const DEFAULT_PW = '1224';
const STATUS = {
  '예정':{bg:'#EDECEA',text:'#4A4945',dot:'#888780'},
  '완료':{bg:'#E1F5EE',text:'#085041',dot:'#1D9E75'},
  '변경':{bg:'#FAEEDA',text:'#633806',dot:'#BA7517'},
};
const TIME_SHORT = {'점심시간':'점심','하교시간':'하교','비대면':'비대면','':'방과후'};

let events=[], notices=[], teams=[], blocks=[];
let adminPw = DEFAULT_PW;
let isLoggedIn = false;
let curYear = new Date().getFullYear(), curMonth = new Date().getMonth();
let filterStatus = '전체', filterTeam = '전체팀';
let selectedDates = [];
let editingEvtId = null;
let fbReady = false;

function $(id){return document.getElementById(id);}
function setSyncStatus(s){
  const dot=$('syncDot'),lbl=$('syncLabel');
  dot.classList.remove('syncing','offline');
  if(s==='syncing'){dot.classList.add('syncing');lbl.textContent='동기화 중...';}
  else if(s==='offline'){dot.classList.add('offline');lbl.textContent='연결 안 됨';}
  else{lbl.textContent='실시간 연결 중';}
}
function toast(msg){
  const el=$('toast');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>{el.style.display='none';},2500);
}

async function saveData(key, obj){
  try{const{ref,set,db}=window.__fb;await set(ref(db,key),obj);}catch(e){setSyncStatus('offline');}
}
async function saveEvents(){
  const obj={};events.forEach(e=>{obj[e.id]=e;});
  await saveData('events',obj);
}
async function saveNotices(){
  const obj={};notices.forEach(n=>{obj[n.id]=n;});
  await saveData('notices',obj);
}
async function saveTeams(){await saveData('teams',teams);}
async function saveBlocks(){
  const obj={};blocks.forEach(b=>{obj[b.id]=b;});
  await saveData('blocks',obj);
}
async function savePw(pw){
  try{const{ref,set,db}=window.__fb;await set(ref(db,'adminPw'),pw);}catch(e){}
}

function startRealtimeSync(){
  const{ref,onValue,db}=window.__fb;
  onValue(ref(db,'events'),(snap)=>{
    const val=snap.val();
    events=val?Object.values(val):[];
    buildCal();buildStats();
  },()=>setSyncStatus('offline'));
  onValue(ref(db,'notices'),(snap)=>{
    const val=snap.val();
    notices=val?Object.values(val):[];
    buildCal();buildNoticeList();
  },()=>setSyncStatus('offline'));
  onValue(ref(db,'teams'),(snap)=>{
    const val=snap.val();
    teams=val?Object.values(val):[];
    buildTeamList();updateTeamSelects();
  },()=>setSyncStatus('offline'));
  onValue(ref(db,'blocks'),(snap)=>{
    const val=snap.val();
    blocks=val?Object.values(val):[];
    buildBlockList();
  },()=>setSyncStatus('offline'));
  onValue(ref(db,'adminPw'),(snap)=>{
    const val=snap.val();if(val)adminPw=val;
  });
  setSyncStatus('online');
}

// 로그인
function checkPw(){
  const v=$('pwInput').value;
  if(v===adminPw){
    isLoggedIn=true;
    $('pwWall').style.display='none';
    const ac=$('adminContent');ac.style.display='flex';
    setDefaultDates();
    buildCal();buildStats();
  }else{
    $('pwErr').textContent='비밀번호가 틀렸습니다.';
    $('pwInput').value='';
  }
}
function logout(){
  isLoggedIn=false;
  $('adminContent').style.display='none';
  $('pwWall').style.display='flex';
  $('pwInput').value='';
  $('pwErr').textContent='';
}

// 탭
function switchTab(tabId){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
  $(tabId).classList.add('active');
}

function setDefaultDates(){
  const t=new Date();
  const ds=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  if($('evtDate'))$('evtDate').value='';
  if($('noticeDate'))$('noticeDate').value=ds;
  if($('blockDate'))$('blockDate').value=ds;
}

// 팀
async function addTeam(){
  const input=$('teamNameInput'),name=input.value.trim();
  if(!name){toast('팀 이름을 입력하세요.');return;}
  if(teams.includes(name)){toast('이미 등록된 팀입니다.');return;}
  teams.push(name);await saveTeams();
  input.value='';toast(`'${name}' 팀이 추가되었습니다.`);
}
async function renameTeam(oldName){
  const newName=prompt('팀 이름을 수정하세요:',oldName);
  if(!newName||newName===oldName)return;
  const trimmed=newName.trim();
  if(!trimmed){toast('팀 이름을 입력하세요.');return;}
  if(teams.includes(trimmed)){toast('이미 존재하는 팀입니다.');return;}
  teams=teams.map(t=>t===oldName?trimmed:t);
  let cnt=0;events.forEach(e=>{if(e.team===oldName){e.team=trimmed;cnt++;}});
  await saveTeams();if(cnt>0)await saveEvents();
  toast(`'${oldName}' → '${trimmed}'로 변경 (일정 ${cnt}건 함께 수정)`);
}
async function deleteTeam(name){
  if(!confirm(`'${name}' 팀을 삭제할까요?`))return;
  teams=teams.filter(t=>t!==name);await saveTeams();
  toast(`'${name}' 팀이 삭제되었습니다.`);
}
function buildTeamList(){
  const list=$('teamList');if(!list)return;
  if(teams.length===0){list.innerHTML='<div class="list-empty">등록된 팀이 없습니다.</div>';return;}
  list.innerHTML='';
  teams.slice().reverse().forEach(name=>{
    const item=document.createElement('div');item.className='list-item';
    const txt=document.createElement('span');txt.className='list-item-text';txt.textContent=name;
    const actions=document.createElement('div');actions.className='list-item-actions';
    const editBtn=document.createElement('button');editBtn.className='list-item-btn';editBtn.textContent='수정';editBtn.onclick=()=>renameTeam(name);
    const delBtn=document.createElement('button');delBtn.className='list-item-btn';delBtn.textContent='삭제';delBtn.onclick=()=>deleteTeam(name);
    actions.appendChild(editBtn);actions.appendChild(delBtn);
    item.appendChild(txt);item.appendChild(actions);list.appendChild(item);
  });
}
function updateTeamSelects(){
  const recentTeams=teams.slice().reverse();
  const sortedTeams=teams.slice().sort();
  ['evtTeam','modalTeam'].forEach(id=>{
    const sel=$(id);if(!sel)return;
    const prev=sel.value;
    sel.innerHTML='<option value="">(팀 없음 - 공지용)</option>';
    recentTeams.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});
    if(recentTeams.includes(prev))sel.value=prev;
  });
  const tf=$('teamFilter');if(!tf)return;
  const prev=tf.value;
  tf.innerHTML='<option value="전체팀">팀 전체</option>';
  recentTeams.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tf.appendChild(o);});
  if(recentTeams.includes(prev)||prev==='전체팀')tf.value=prev;
}

// 일정 추가
function renderDateChips(){
  const c=$('evtDateChips');if(!c)return;
  c.innerHTML='';
  selectedDates.forEach(d=>{
    const chip=document.createElement('span');chip.className='date-chip';
    chip.innerHTML=`${d} <span class="date-chip-del" onclick="removeDateChip('${d}')">×</span>`;
    c.appendChild(chip);
  });
}
function removeDateChip(date){selectedDates=selectedDates.filter(d=>d!==date);renderDateChips();}
function clearForm(){
  selectedDates=[];renderDateChips();
  if($('evtDate'))$('evtDate').value='';
  if($('evtTeam'))$('evtTeam').value='';
  if($('evtNote'))$('evtNote').value='';
  if($('evtTime'))$('evtTime').value='점심시간';
  if($('evtStatus'))$('evtStatus').value='예정';
  $('addBtn').textContent='+ 일정 추가';
  $('addBtn').onclick=addEvent;
  buildCal();
}
async function addEvent(){
  const team=$('evtTeam').value.trim();
  const time=$('evtTime').value;
  const status=$('evtStatus').value;
  const note=$('evtNote').value.trim();
  const singleDate=$('evtDate').value;
  const dates=selectedDates.length>0?selectedDates:(singleDate?[singleDate]:[]);
  if(dates.length===0){toast('날짜를 선택하세요.');return;}
  if(!team&&!note){toast('팀 이름 또는 공지사항을 입력하세요.');return;}
  const now=Date.now();
  dates.forEach((date,idx)=>{events.push({id:now+idx,date,team,time,status,note,locked:false});});
  toast(`${dates.length}건 일정이 추가되었습니다.`);
  clearForm();
  await saveEvents();
}

// 공지
async function addNotice(){
  const text=$('noticeText').value.trim(),date=$('noticeDate').value;
  if(!text){toast('공지 내용을 입력하세요.');return;}
  if(!date){toast('날짜를 선택하세요.');return;}
  notices.push({id:Date.now(),date,text});
  toast(`${date} 공지가 추가되었습니다.`);
  $('noticeText').value='';
  await saveNotices();
}
async function deleteNotice(id){
  notices=notices.filter(n=>n.id!==id);await saveNotices();
}
async function editNotice(id){
  const n=notices.find(n=>n.id===id);if(!n)return;
  const t=prompt('공지사항을 수정하세요:',n.text);
  if(!t||!t.trim())return;
  n.text=t.trim();await saveNotices();toast('공지가 수정되었습니다.');
}
function buildNoticeList(){
  const list=$('noticeList');if(!list)return;
  if(notices.length===0){list.innerHTML='<div class="list-empty">등록된 공지가 없습니다.</div>';return;}
  list.innerHTML='';
  notices.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(n=>{
    const item=document.createElement('div');item.className='list-item';
    const txt=document.createElement('span');txt.className='list-item-text';txt.textContent=`${n.date} ${n.text}`;
    const actions=document.createElement('div');actions.className='list-item-actions';
    const eBtn=document.createElement('button');eBtn.className='list-item-btn';eBtn.textContent='수정';eBtn.onclick=()=>editNotice(n.id);
    const dBtn=document.createElement('button');dBtn.className='list-item-btn';dBtn.textContent='삭제';dBtn.onclick=()=>deleteNotice(n.id);
    actions.appendChild(eBtn);actions.appendChild(dBtn);
    item.appendChild(txt);item.appendChild(actions);list.appendChild(item);
  });
}

// 차단
async function addBlock(){
  const date=$('blockDate').value,time=$('blockTime').value;
  if(!date){toast('날짜를 선택하세요.');return;}
  if(blocks.find(b=>b.date===date&&b.time===time)){toast('이미 차단된 조합입니다.');return;}
  blocks.push({id:Date.now(),date,time});
  toast(`${date} ${TIME_SHORT[time]||'방과후'} 차단이 추가되었습니다.`);
  await saveBlocks();
}
async function deleteBlock(id){blocks=blocks.filter(b=>b.id!==id);await saveBlocks();}
function buildBlockList(){
  const list=$('blockList');if(!list)return;
  if(blocks.length===0){list.innerHTML='<div class="list-empty">등록된 차단이 없습니다.</div>';return;}
  list.innerHTML='';
  blocks.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{
    const item=document.createElement('div');item.className='list-item';
    const txt=document.createElement('span');txt.className='list-item-text';txt.textContent=`${b.date} · ${TIME_SHORT[b.time]!==undefined?(TIME_SHORT[b.time]||'방과후'):b.time}`;
    const dBtn=document.createElement('button');dBtn.className='list-item-btn';dBtn.textContent='해제';dBtn.onclick=()=>deleteBlock(b.id);
    item.appendChild(txt);item.appendChild(dBtn);list.appendChild(item);
  });
}

// 달력 클릭 → 날짜 선택
function toggleDateSelect(dateStr){
  if(selectedDates.includes(dateStr)){
    selectedDates=selectedDates.filter(d=>d!==dateStr);
  }else{
    selectedDates.push(dateStr);selectedDates.sort();
  }
  renderDateChips();buildCal();
  // 일정 탭으로 이동
  switchTab('tab-event');
}

// 일정 수정 모달
function openEditModal(id){
  const evt=events.find(e=>e.id===id);if(!evt)return;
  editingEvtId=id;
  $('modalDate').value=evt.date;
  $('modalTime').value=evt.time||'';
  $('modalStatus').value=evt.status||'예정';
  $('modalNote').value=evt.note||'';
  updateModalLockBtn(evt.locked||false);
  const sel=$('modalTeam');
  sel.innerHTML='<option value="">(팀 없음)</option>';
  teams.slice().reverse().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});
  sel.value=evt.team||'';
  $('editModal').classList.add('open');
}
function updateModalLockBtn(locked){
  const btn=$('btnModalLock');if(!btn)return;
  if(locked){btn.textContent='🔒 잠금 ON';btn.style.background='var(--red-50)';btn.style.color='var(--red-400)';btn.style.borderColor='var(--red-400)';}
  else{btn.textContent='🔓 잠금 OFF';btn.style.background='var(--teal-50)';btn.style.color='var(--teal-800)';btn.style.borderColor='var(--teal-400)';}
}
function toggleModalLock(){updateModalLockBtn(!$('btnModalLock').textContent.includes('ON'));}
async function saveModal(){
  const evt=events.find(e=>e.id===editingEvtId);if(!evt)return;
  evt.date=$('modalDate').value;evt.team=$('modalTeam').value;
  evt.time=$('modalTime').value;evt.status=$('modalStatus').value;
  evt.note=$('modalNote').value.trim();
  evt.locked=$('btnModalLock').textContent.includes('ON');
  toast('일정이 수정되었습니다.');closeModal();await saveEvents();
}
async function deleteModal(){
  if(!confirm('이 일정을 삭제할까요?'))return;
  events=events.filter(e=>e.id!==editingEvtId);
  toast('일정이 삭제되었습니다.');closeModal();await saveEvents();
}
function closeModal(){$('editModal').classList.remove('open');editingEvtId=null;}

// 통계
function buildStats(){
  const ms=`${curYear}-${String(curMonth+1).padStart(2,'0')}`;
  const me=events.filter(e=>e.date.startsWith(ms)&&e.team);
  const total=me.length,done=me.filter(e=>e.status==='완료').length;
  $('sTot').textContent=total;$('sDone').textContent=done;
  $('sPct').textContent=total?Math.round(done/total*100)+'%':'0%';
}

// 달력
function buildCal(){
  buildStats();
  $('monthLabel').textContent=`${curYear}년 ${curMonth+1}월`;
  const grid=$('calGrid');grid.innerHTML='';
  const today=new Date();
  const firstDay=new Date(curYear,curMonth,1).getDay();
  const lastDate=new Date(curYear,curMonth+1,0).getDate();
  const ms=`${curYear}-${String(curMonth+1).padStart(2,'0')}`;

  for(let i=0;i<firstDay;i++){const c=document.createElement('div');c.className='cell empty';grid.appendChild(c);}
  for(let d=1;d<=lastDate;d++){
    const dow=(firstDay+d-1)%7;
    const isToday=today.getFullYear()===curYear&&today.getMonth()===curMonth&&today.getDate()===d;
    const dateStr=`${ms}-${String(d).padStart(2,'0')}`;
    const isSelected=selectedDates.includes(dateStr);
    const dayEvts=events.filter(e=>e.date===dateStr&&(filterStatus==='전체'||e.status===filterStatus||!e.team)&&(filterTeam==='전체팀'||e.team===filterTeam||!e.team));
    const dayNotices=notices.filter(n=>n.date===dateStr);

    const cell=document.createElement('div');
    cell.className='cell'+(isToday?' today':'')+(dow===0||dow===6?' weekend':'')+(isSelected?' selected':'');

    const dn=document.createElement('div');
    dn.className='dn'+(dow===0?' sun':dow===6?' sat':'');
    dn.onclick=()=>toggleDateSelect(dateStr);
    if(isToday){const s=document.createElement('span');s.className='today-circle';s.textContent=d;dn.appendChild(s);}
    else{dn.textContent=d;}
    cell.appendChild(dn);

    dayNotices.forEach(n=>{
      const nb=document.createElement('span');nb.className='note-evt';nb.textContent='⚠ '+n.text;cell.appendChild(nb);
    });
    dayEvts.forEach(evt=>{
      if(evt.note&&!evt.team){
        const nb=document.createElement('span');nb.className='note-evt';nb.textContent='⚠ '+evt.note;
        const db=document.createElement('span');db.style.cssText='font-size:9px;color:#aaa;cursor:pointer;display:block;';db.textContent='삭제';db.onclick=()=>deleteEvt(evt.id);
        cell.appendChild(nb);cell.appendChild(db);return;
      }
      const c=STATUS[evt.status]||STATUS['예정'];
      const el=document.createElement('div');el.className='evt';
      el.style.background=c.bg;el.style.color=c.text;
      el.onclick=()=>openEditModal(evt.id);
      const dot=document.createElement('span');dot.className='evt-dot';dot.style.background=c.dot;
      const lbl=document.createElement('span');lbl.className='evt-text';
      lbl.textContent=evt.team+(evt.time!==undefined?`(${TIME_SHORT[evt.time]||evt.time||'방과후'})`:'');
      const del=document.createElement('span');del.className='evt-del';del.textContent='✕';
      del.onclick=(e)=>{e.stopPropagation();deleteEvt(evt.id);};
      el.appendChild(dot);el.appendChild(lbl);el.appendChild(del);
      cell.appendChild(el);
    });

    const ab=document.createElement('button');ab.className='add-cell-btn';ab.textContent='+ 추가';
    ab.onclick=()=>{
      if(!selectedDates.includes(dateStr)){selectedDates.push(dateStr);selectedDates.sort();renderDateChips();buildCal();}
      switchTab('tab-event');
    };
    cell.appendChild(ab);
    grid.appendChild(cell);
  }
}
async function deleteEvt(id){
  if(!confirm('이 일정을 삭제할까요?'))return;
  events=events.filter(e=>e.id!==id);toast('삭제되었습니다.');await saveEvents();
}

// 비밀번호 변경
async function changePw(){
  const a=$('newPw1').value.trim(),b=$('newPw2').value.trim();
  if(!a){toast('새 비밀번호를 입력하세요.');return;}
  if(a!==b){toast('비밀번호가 일치하지 않습니다.');return;}
  adminPw=a;await savePw(a);
  $('newPw1').value='';$('newPw2').value='';
  toast('비밀번호가 변경되었습니다.');
}

// 이벤트 바인딩
function bindEvents(){
  $('btnLogin').onclick=()=>checkPw();
  $('pwInput').onkeydown=(e)=>{if(e.key==='Enter')checkPw();};
  $('btnLogout').onclick=()=>logout();
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.onclick=()=>switchTab(btn.dataset.tab);
  });
  $('btnTeamAdd').onclick=()=>addTeam();
  $('teamNameInput').onkeydown=(e)=>{if(e.key==='Enter')addTeam();};
  $('evtDate').addEventListener('change',()=>{
    const val=$('evtDate').value;if(!val)return;
    if(!selectedDates.includes(val)){selectedDates.push(val);selectedDates.sort();renderDateChips();}
    $('evtDate').value='';buildCal();
  });
  $('addBtn').onclick=()=>addEvent();
  $('btnClear').onclick=()=>clearForm();
  $('btnNoticeAdd').onclick=()=>addNotice();
  $('btnNoticeClear').onclick=()=>{$('noticeText').value='';};
  $('btnBlockAdd').onclick=()=>addBlock();
  $('btnChangePw').onclick=()=>changePw();
  $('btnModalSave').onclick=()=>saveModal();
  $('btnModalDelete').onclick=()=>deleteModal();
  $('btnModalCancel').onclick=()=>closeModal();
  $('editModal').onclick=(e)=>{if(e.target===$('editModal'))closeModal();};
  $('btnPrev').onclick=()=>{curMonth--;if(curMonth<0){curMonth=11;curYear--;}buildCal();};
  $('btnNext').onclick=()=>{curMonth++;if(curMonth>11){curMonth=0;curYear++;}buildCal();};
  $('btnToday').onclick=()=>{const t=new Date();curYear=t.getFullYear();curMonth=t.getMonth();buildCal();};
  document.querySelectorAll('.ftag').forEach(btn=>{
    btn.onclick=()=>{
      filterStatus=btn.dataset.filter;
      document.querySelectorAll('.ftag').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');buildCal();
    };
  });
  $('teamFilter').addEventListener('change',(e)=>{filterTeam=e.target.value;buildCal();});
}

function init(){
  bindEvents();
  buildCal();
  window.addEventListener('fb-ready',()=>{
    fbReady=true;
    startRealtimeSync();
  });
  setTimeout(()=>{if(!fbReady)setSyncStatus('offline');},2000);
}
init();
</script>
</body>
</html>
